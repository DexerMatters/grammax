[package]
name = "grammax"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
internment = { version = "0.8.6", features = ["arena"] }
rustc-hash = "2.1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
rouille = { version = "3.6.2", optional = true }
clap = { version = "4.5.60", features = ["derive"] }
color-print = "0.3.7"
serde_json = "1.0.149"
crossbeam = "0.8.4"
rust-embed = { version = "8.11.0", optional = true, features = ["include-exclude"] }
mime_guess = { version = "2.0.5", optional = true }
ctrlc = "3.5.2"

[dependencies.tower-lsp]
version = "*"
optional = true
default-features = false
features = ["runtime-agnostic"]


[features]
webui = ["dep:rouille", "dep:mime_guess", "dep:rust-embed"]
vsclsp = ["dep:tower-lsp"]